    <path d="M-65,-10 C-65,-75 -30,-85 0,-85 C30,-85 65,-75 65,-10 C45,-60 -45,-60 -65,-10 Z" fill="#1C1815"/>
    <!-- Glasses -->
    <rect x="-42" y="0" width="34" height="20" rx="5" fill="none" stroke="#C5A36A" stroke-width="2.5"/>
    <rect x="8" y="0" width="34" height="20" rx="5" fill="none" stroke="#C5A36A" stroke-width="2.5"/>
    <line x1="-8" y1="10" x2="8" y2="10" stroke="#C5A36A" stroke-width="2"/>
  </g>
  <rect x="20" y="20" width="460" height="510" fill="none" stroke="#C5A36A" stroke-width="1.2" stroke-opacity="0.5"/>
