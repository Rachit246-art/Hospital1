      <stop offset="0%" stop-color="#EAE3D5"/>
      <stop offset="50%" stop-color="#D9CFC0"/>
      <stop offset="100%" stop-color="#C5B9A6"/>
    </linearGradient>
  </defs>
  <rect width="500" height="550" fill="url(#doc-bg1)"/>
