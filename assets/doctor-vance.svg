<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <linearGradient id="doc-bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFE8DE"/>
      <stop offset="50%" stop-color="#DFD5C6"/>
      <stop offset="100%" stop-color="#CCC0AE"/>
    </linearGradient>
  </defs>
  <rect width="500" height="550" fill="url(#doc-bg2)"/>
  <!-- Portrait Silhouette: Dr. Eleanor Vance -->
  <g transform="translate(250, 270)">
    <path d="M-130,280 C-110,130 -80,90 0,90 C80,90 110,130 130,280 Z" fill="#FAF9F6"/>
    <!-- Navy silk blouse -->
    <path d="M-40,90 L0,150 L40,90 Z" fill="#183F34"/>
    <ellipse cx="0" cy="140" rx="6" ry="6" fill="#C5A36A"/>
    <!-- Head & Hair -->
    <ellipse cx="0" cy="15" rx="60" ry="70" fill="#E2C4A8"/>
    <!-- Elegant hair silhouette -->
    <path d="M-65,30 C-75,-60 -20,-85 0,-85 C20,-85 75,-60 65,30 C55,70 50,110 50,130 C30,95 -30,95 -50,130 C-50,110 -55,70 -65,30 Z" fill="#3D291C"/>
    <!-- Stethoscope -->
    <path d="M-60,110 C-40,210 40,210 60,110" stroke="#C5A36A" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <rect x="20" y="20" width="460" height="510" fill="none" stroke="#C5A36A" stroke-width="1.2" stroke-opacity="0.5"/>
</svg>

