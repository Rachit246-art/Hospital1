<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mri-suite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFEBE2"/>
      <stop offset="40%" stop-color="#E2DDD1"/>
      <stop offset="100%" stop-color="#CEC7B7"/>
    </linearGradient>
    <radialGradient id="ring-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE8C2" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#C5A36A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#102C24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanner-shell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F2EFEA"/>
      <stop offset="100%" stop-color="#DDD6C8"/>
    </linearGradient>
    <linearGradient id="bore-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142B23"/>
      <stop offset="100%" stop-color="#071410"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#mri-suite)"/>

  <!-- Back Wall with Acoustic Wood Slats & Ambient LED Cove -->
  <g opacity="0.35">
    <line x1="80" y1="0" x2="80" y2="350" stroke="#7A6655" stroke-width="3"/>
    <line x1="120" y1="0" x2="120" y2="350" stroke="#7A6655" stroke-width="3"/>
    <line x1="160" y1="0" x2="160" y2="350" stroke="#7A6655" stroke-width="3"/>
    <line x1="640" y1="0" x2="640" y2="350" stroke="#7A6655" stroke-width="3"/>
    <line x1="680" y1="0" x2="680" y2="350" stroke="#7A6655" stroke-width="3"/>
    <line x1="720" y1="0" x2="720" y2="350" stroke="#7A6655" stroke-width="3"/>
  </g>

  <!-- Ceiling Skylight Illusion / Circadian Nature Skylight Light Panel -->
  <rect x="250" y="20" width="300" height="40" rx="8" fill="#FFFDF9" stroke="#C5A36A" stroke-width="2" filter="drop-shadow(0 0 20px #FFE7BA)"/>
  <text x="400" y="45" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#8C795A">CIRCADIAN SKYLIGHT • CALM ATMOSPHERE</text>

  <!-- Flooring: Anti-static Seamless Terrazzo / Micro-cement -->
  <polygon points="0,350 800,350 800,500 0,500" fill="#E2DDD2"/>
  <line x1="0" y1="350" x2="800" y2="350" stroke="#C5A36A" stroke-width="1.5"/>

  <!-- Futuristic Ultra-Silent 3T MRI Scanner Gantry (Center) -->
  <g transform="translate(400, 260)">
    <!-- Floor Shadow -->
    <ellipse cx="0" cy="110" rx="200" ry="25" fill="#102C24" opacity="0.15" filter="blur(10px)"/>

    <!-- Outer Gantry Ring & Shell -->
    <ellipse cx="0" cy="0" rx="160" ry="160" fill="url(#scanner-shell)" stroke="#C5A36A" stroke-width="3"/>
    
    <!-- Champagne Gold Accent Halo Outer Trim -->
    <ellipse cx="0" cy="0" rx="145" ry="145" fill="none" stroke="#C5A36A" stroke-width="4"/>

    <!-- Ambient Ambient LED Halo (Warm Champagne Gold) -->
    <circle cx="0" cy="0" r="120" fill="url(#ring-glow)"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#FFE7BA" stroke-width="8" filter="drop-shadow(0 0 12px #FFD799)"/>

    <!-- Scanner Bore (Tunnel Interior) -->
    <ellipse cx="0" cy="0" rx="90" ry="90" fill="url(#bore-dark)"/>
    <ellipse cx="0" cy="0" rx="80" ry="80" fill="none" stroke="#2B6B59" stroke-width="1.5" opacity="0.6"/>

    <!-- Patient Examination Couch / Automated Robotic Table -->
    <g transform="translate(0, 30)">
      <!-- Bed Extender into Bore -->
      <polygon points="-45,0 45,0 35,-60 -35,-60" fill="#D3CBC0"/>
      <!-- Soft Ergonomic Patient Mattress (Pristine Ivory) -->
      <path d="M-60,0 L60,0 L80,120 L-80,120 Z" fill="#FAF9F6" stroke="#D3CBC0" stroke-width="1"/>
      <ellipse cx="0" cy="5" rx="55" ry="10" fill="#FAF9F6"/>
      <!-- Headrest Cushion -->
      <rect x="-35" y="-15" width="70" height="22" rx="8" fill="#F4F0E8" stroke="#C5A36A" stroke-width="1"/>
      
      <!-- Table Pedestal Base (Brushed Metallic & Wood) -->
      <polygon points="-40,120 40,120 48,150 -48,150" fill="#102C24"/>
      <line x1="-48" y1="135" x2="48" y2="135" stroke="#C5A36A" stroke-width="2"/>
    </g>

    <!-- Display / Operator Status Ring on Gantry Face -->
    <text x="0" y="-120" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="3" fill="#102C24">3.0 TESLA BIO-MATRIX</text>
  </g>

  <!-- Side Floating Glass Control Console -->
  <g transform="translate(680, 240)">
    <rect x="-40" y="0" width="100" height="120" rx="10" fill="#FAF9F6" stroke="#C5A36A" stroke-width="1.5" opacity="0.95"/>
    <rect x="-30" y="10" width="80" height="50" rx="4" fill="#102C24"/>
    <line x1="-20" y1="35" x2="30" y2="35" stroke="#5EEAD4" stroke-width="2"/>
    <circle cx="20" cy="80" r="10" fill="#C5A36A"/>
    <circle cx="-10" cy="80" r="6" fill="#102C24"/>
  </g>

  <!-- Badge in top left corner -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#FAF9F6" stroke="#C5A36A" stroke-width="1"/>
    <circle cx="18" cy="17" r="6" fill="#102C24"/>
    <text x="34" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#102C24">SUITE A • MRI &amp; SPECTRAL CT</text>
  </g>
</svg>

