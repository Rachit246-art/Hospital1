<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cardio-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="50%" stop-color="#F4EFE6"/>
      <stop offset="100%" stop-color="#EBE3D3"/>
    </linearGradient>
    <linearGradient id="heart-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#C24136"/>
      <stop offset="40%" stop-color="#9E2A2B"/>
      <stop offset="75%" stop-color="#691D23"/>
      <stop offset="100%" stop-color="#3B1015"/>
    </linearGradient>
    <linearGradient id="aorta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A36A"/>
      <stop offset="60%" stop-color="#9E2A2B"/>
      <stop offset="100%" stop-color="#540B0E"/>
    </linearGradient>
    <linearGradient id="vein-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#225244"/>
      <stop offset="100%" stop-color="#102C24"/>
    </linearGradient>
    <filter id="shadow-c" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#102C24" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#cardio-bg)"/>
  
  <!-- Subtle circular grid lines -->
  <circle cx="300" cy="225" r="160" stroke="#C5A36A" stroke-opacity="0.15" stroke-dasharray="4 4" fill="none"/>
  <circle cx="300" cy="225" r="195" stroke="#C5A36A" stroke-opacity="0.08" stroke-dasharray="6 6" fill="none"/>
  <circle cx="300" cy="225" r="120" stroke="#102C24" stroke-opacity="0.06" fill="none"/>

  <!-- Anatomical Heart Illustration -->
  <g filter="url(#shadow-c)" transform="translate(300, 220) scale(0.95)">
    <!-- Superior Vena Cava -->
    <path d="M-55,-130 C-50,-100 -40,-80 -40,-40 C-30,-40 -20,-50 -20,-110 C-35,-125 -45,-130 -55,-130 Z" fill="url(#vein-blue)"/>
    <!-- Pulmonary Artery & Aorta Arches -->
    <path d="M-25,-120 C-20,-155 35,-165 65,-125 C75,-110 70,-85 55,-60 C40,-75 20,-85 0,-85 C-15,-85 -20,-105 -25,-120 Z" fill="url(#aorta-grad)"/>
    <!-- Brachiocephalic branches -->
    <path d="M-5,-145 L0,-175 L12,-175 L10,-142 Z" fill="#C5A36A"/>
    <path d="M18,-148 L26,-175 L38,-175 L30,-142 Z" fill="#C5A36A"/>
    <path d="M42,-140 L54,-168 L64,-165 L52,-132 Z" fill="#C5A36A"/>
    
    <!-- Left Pulmonary Artery -->
    <path d="M40,-70 C70,-75 95,-55 105,-40 C95,-30 70,-35 45,-50 Z" fill="url(#vein-blue)"/>
    
    <!-- Heart Ventricles & Atria Main Body -->
    <path d="M-75,-30 C-95,-10 -90,45 -65,85 C-45,115 -10,145 10,165 C18,172 24,170 30,160 C55,120 95,50 90,-10 C88,-45 60,-65 20,-60 C-10,-55 -30,-40 -50,-40 C-65,-40 -70,-35 -75,-30 Z" fill="url(#heart-grad)"/>

    <!-- Coronary Arteries (Gold / Crimson Network) -->
    <path d="M-15,-20 Q-10,30 5,80 Q15,115 12,150" stroke="#C5A36A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-5,10 Q-25,35 -40,65" stroke="#C5A36A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M3,50 Q25,75 35,95" stroke="#C5A36A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M-2,85 Q-20,105 -28,125" stroke="#C5A36A" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M8,110 Q20,125 24,140" stroke="#C5A36A" stroke-width="1.2" fill="none" stroke-linecap="round"/>

    <!-- Subtle Muscle Texture & Highlight -->
    <path d="M-65,20 C-60,70 -35,110 5,145" stroke="#E26D5C" stroke-width="2" stroke-dasharray="3 8" fill="none" opacity="0.4"/>
    <path d="M-70,-15 C-85,15 -75,60 -55,90" stroke="#FAF9F6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.25"/>
  </g>

  <!-- High-tech EKG subtle trace -->
  <path d="M40,390 L200,390 L215,370 L225,410 L235,350 L248,425 L258,380 L270,390 L560,390" stroke="#C5A36A" stroke-width="1.5" fill="none" opacity="0.45"/>
  <circle cx="248" cy="425" r="3" fill="#C5A36A"/>
  
  <text x="50" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#102C24" opacity="0.6">ANATOMICAL CARDIOLOGY</text>
  <text x="540" y="55" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#C5A36A">DEPT. 01</text>
</svg>

