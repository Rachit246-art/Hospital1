<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fem-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF7"/>
      <stop offset="50%" stop-color="#F7F1EB"/>
      <stop offset="100%" stop-color="#EFE6DD"/>
    </linearGradient>
    <linearGradient id="petal-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="40%" stop-color="#F5E4DA"/>
      <stop offset="80%" stop-color="#DEBDB0"/>
      <stop offset="100%" stop-color="#C59B8E"/>
    </linearGradient>
    <linearGradient id="petal-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8ECE6"/>
      <stop offset="60%" stop-color="#E2B7A8"/>
      <stop offset="100%" stop-color="#C28775"/>
    </linearGradient>
    <linearGradient id="leaf-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A6B5B"/>
      <stop offset="100%" stop-color="#102C24"/>
    </linearGradient>
    <filter id="shadow-f" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#102C24" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#fem-bg)"/>

  <!-- Subtle concentric botanical ring -->
  <circle cx="300" cy="225" r="160" stroke="#C5A36A" stroke-opacity="0.15" stroke-dasharray="4 4" fill="none"/>
  <circle cx="300" cy="225" r="195" stroke="#C5A36A" stroke-opacity="0.08" stroke-dasharray="6 6" fill="none"/>

  <!-- Delicate Luxury Peony / Camellia Bloom -->
  <g filter="url(#shadow-f)" transform="translate(300, 225)">
    <!-- Leaves (Deep Forest Green) -->
    <path d="M-80,60 C-130,90 -160,80 -170,140 C-120,150 -80,110 -60,80 Z" fill="url(#leaf-green)"/>
    <path d="M-170,140 Q-110,105 -60,80" stroke="#C5A36A" stroke-width="1.2" fill="none" opacity="0.6"/>
    
    <path d="M80,50 C120,80 150,70 165,130 C120,140 80,100 65,70 Z" fill="url(#leaf-green)"/>
    <path d="M165,130 Q115,95 65,70" stroke="#C5A36A" stroke-width="1.2" fill="none" opacity="0.6"/>

    <path d="M-100,-70 C-140,-100 -130,-140 -160,-170 C-170,-120 -140,-80 -90,-50 Z" fill="url(#leaf-green)" opacity="0.85"/>
    <path d="M90,-60 C130,-90 140,-130 170,-160 C160,-110 130,-70 80,-40 Z" fill="url(#leaf-green)" opacity="0.85"/>

    <!-- Outer Petals Layer 1 -->
    <path d="M-90,-50 C-130,-10 -110,70 -60,110 C-10,140 60,120 100,80 C130,30 120,-30 80,-80 C30,-120 -40,-110 -90,-50 Z" fill="url(#petal-rose)" opacity="0.95"/>
    
    <!-- Outer Petal Ribs & Veins -->
    <path d="M0,0 Q-70,-30 -85,-45" stroke="#C5A36A" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M0,0 Q-80,40 -50,90" stroke="#C5A36A" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M0,0 Q60,60 85,65" stroke="#C5A36A" stroke-width="1" fill="none" opacity="0.3"/>
    <path d="M0,0 Q70,-40 65,-70" stroke="#C5A36A" stroke-width="1" fill="none" opacity="0.3"/>

    <!-- Petal Layer 2 -->
    <path d="M-60,-40 C-85,-5 -70,55 -35,80 C5,100 50,85 75,55 C95,15 85,-25 55,-60 C20,-90 -30,-80 -60,-40 Z" fill="url(#petal-inner)" opacity="0.9"/>

    <!-- Center Blooming Petals & Pistils -->
    <path d="M-35,-20 C-50,0 -40,35 -15,50 C10,60 40,50 50,25 C60,-5 50,-20 30,-40 C5,-55 -20,-45 -35,-20 Z" fill="#FFF8F5"/>
    <path d="M-20,-10 C-30,5 -20,25 -5,30 C10,35 25,25 30,10 C35,-10 25,-20 15,-25 C0,-30 -10,-20 -20,-10 Z" fill="#E8B5A3"/>

    <!-- Golden Stamen Cluster (Champagne Gold) -->
    <circle cx="0" cy="0" r="16" fill="#102C24" opacity="0.1"/>
    <g fill="#C5A36A">
      <circle cx="-6" cy="-8" r="2.5"/>
      <circle cx="5" cy="-7" r="3"/>
      <circle cx="9" cy="2" r="2.5"/>
      <circle cx="2" cy="9" r="3"/>
      <circle cx="-8" cy="4" r="2.5"/>
      <circle cx="0" cy="0" r="3.5" fill="#FAF9F6"/>
    </g>
  </g>

  <text x="50" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#102C24" opacity="0.6">WOMEN'S &amp; MATERNAL HEALTH</text>
  <text x="540" y="55" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#C5A36A">DEPT. 05</text>
</svg>

