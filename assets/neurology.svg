<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="neuro-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="50%" stop-color="#F3ECE2"/>
      <stop offset="100%" stop-color="#E9E0D0"/>
    </linearGradient>
    <linearGradient id="brain-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D5C4"/>
      <stop offset="40%" stop-color="#D4BCAB"/>
      <stop offset="80%" stop-color="#BFA391"/>
      <stop offset="100%" stop-color="#9E8270"/>
    </linearGradient>
    <radialGradient id="synapse-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A36A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C5A36A" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-b" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#102C24" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#neuro-bg)"/>
  
  <!-- Neural geometric grid -->
  <circle cx="300" cy="225" r="160" stroke="#C5A36A" stroke-opacity="0.15" stroke-dasharray="4 4" fill="none"/>
  <circle cx="300" cy="225" r="195" stroke="#C5A36A" stroke-opacity="0.08" stroke-dasharray="6 6" fill="none"/>

  <!-- Realistic Brain Anatomical Silhouette & Convolutions -->
  <g filter="url(#shadow-b)" transform="translate(300, 220) scale(0.95)">
    <!-- Brain Stem & Cerebellum -->
    <path d="M-40,80 C-40,110 -20,135 0,140 C15,140 25,120 25,95 C15,90 -20,80 -40,80 Z" fill="#9E8270"/>
    <path d="M-85,60 C-95,95 -75,125 -30,120 C-35,100 -35,80 -45,65 C-60,60 -75,60 -85,60 Z" fill="#AF9482"/>
    <!-- Cerebellum Foliar Ridges -->
    <path d="M-80,75 Q-55,80 -35,90" stroke="#FAF9F6" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M-75,90 Q-55,95 -35,105" stroke="#FAF9F6" stroke-width="1.5" fill="none" opacity="0.4"/>
    <path d="M-65,105 Q-50,110 -35,115" stroke="#FAF9F6" stroke-width="1.5" fill="none" opacity="0.4"/>

    <!-- Main Cerebral Hemispheres (Lateral View) -->
    <path d="M-135,10 C-145,-40 -115,-100 -60,-130 C-10,-155 60,-155 110,-125 C145,-95 160,-50 155,0 C150,45 125,75 80,85 C55,90 20,85 5,80 C-5,50 -25,40 -60,45 C-100,50 -125,45 -135,10 Z" fill="url(#brain-fill)"/>

    <!-- Sulci and Gyri (Brain Folds) in Forest Green & Gold -->
    <!-- Frontal Lobe -->
    <path d="M70,-130 C45,-110 30,-80 50,-50 C65,-25 95,-30 115,-60 C125,-85 105,-115 70,-130" stroke="#102C24" stroke-width="2.5" fill="none" opacity="0.55" stroke-linecap="round"/>
    <path d="M10,-145 C-5,-115 5,-80 25,-75 C45,-70 55,-40 30,-20" stroke="#102C24" stroke-width="2.2" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M75,-80 C95,-65 130,-50 145,-15" stroke="#102C24" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
    
    <!-- Parietal Lobe -->
    <path d="M-40,-135 C-20,-105 -15,-70 -35,-55 C-55,-40 -40,-10 -20,10" stroke="#102C24" stroke-width="2.5" fill="none" opacity="0.55" stroke-linecap="round"/>
    <path d="M-85,-115 C-60,-90 -65,-55 -80,-35 C-95,-15 -80,15 -60,25" stroke="#102C24" stroke-width="2.2" fill="none" opacity="0.5" stroke-linecap="round"/>

    <!-- Occipital Lobe -->
    <path d="M-130,-40 C-110,-25 -105,5 -125,20" stroke="#102C24" stroke-width="2.2" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M-115,-70 C-95,-55 -110,-15 -95,10" stroke="#102C24" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>

    <!-- Temporal Lobe (Lateral Sulcus / Sylvian Fissure) -->
    <path d="M-80,10 C-30,-15 30,-10 70,25 C95,50 60,70 20,65 C-20,60 -50,45 -80,10" stroke="#102C24" stroke-width="2.8" fill="none" opacity="0.6" stroke-linecap="round"/>
    <path d="M-40,25 C-10,15 25,20 45,45" stroke="#102C24" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round"/>

    <!-- Synaptic Network Lights (Gold) -->
    <g stroke="#C5A36A" stroke-width="1.2" fill="#C5A36A">
      <line x1="30" y1="-80" x2="65" y2="-60" opacity="0.7"/>
      <line x1="65" y1="-60" x2="80" y2="-20" opacity="0.7"/>
      <line x1="80" y1="-20" x2="45" y2="10" opacity="0.7"/>
      <line x1="45" y1="10" x2="-10" y2="-20" opacity="0.7"/>
      <line x1="-10" y1="-20" x2="-40" y2="-65" opacity="0.7"/>
      <line x1="-40" y1="-65" x2="10" y2="-100" opacity="0.7"/>
      
      <circle cx="30" cy="-80" r="3.5"/>
      <circle cx="65" cy="-60" r="4"/>
      <circle cx="80" cy="-20" r="3"/>
      <circle cx="45" cy="10" r="4.5"/>
      <circle cx="-10" cy="-20" r="3.5"/>
      <circle cx="-40" cy="-65" r="4"/>
      <circle cx="10" cy="-100" r="3.5"/>
      <circle cx="110" cy="-45" r="3"/>
      <circle cx="-80" cy="-25" r="3.5"/>
    </g>
  </g>

  <!-- High-tech EEG / Neural Scan Wave -->
  <path d="M50,390 Q120,380 180,395 T300,390 T420,385 T550,390" stroke="#C5A36A" stroke-width="1.5" fill="none" opacity="0.4"/>
  <text x="50" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#102C24" opacity="0.6">CLINICAL NEUROLOGY</text>
  <text x="540" y="55" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#C5A36A">DEPT. 02</text>
</svg>

