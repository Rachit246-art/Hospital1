<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="suite-wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="50%" stop-color="#F2EDE4"/>
      <stop offset="100%" stop-color="#E5DEC0"/>
    </linearGradient>
    <linearGradient id="window-garden" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BB3A3"/>
      <stop offset="40%" stop-color="#A5C7B7"/>
      <stop offset="70%" stop-color="#6F9988"/>
      <stop offset="100%" stop-color="#496B5C"/>
    </linearGradient>
    <linearGradient id="suite-floor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B735F"/>
      <stop offset="25%" stop-color="#9C836E"/>
      <stop offset="50%" stop-color="#8B735F"/>
      <stop offset="75%" stop-color="#9C836E"/>
      <stop offset="100%" stop-color="#7B6552"/>
    </linearGradient>
    <linearGradient id="bed-linens" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F7F5F0"/>
      <stop offset="100%" stop-color="#EBE5D8"/>
    </linearGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="800" height="500" fill="url(#suite-wall)"/>

  <!-- Floor-to-Ceiling Windows (Right Half: 380px to 800px) -->
  <rect x="380" y="0" width="420" height="360" fill="url(#window-garden)"/>
  
  <!-- Garden Trees & Botanical Horizon Outside Window -->
  <ellipse cx="480" cy="240" rx="90" ry="110" fill="#2E5C4B" opacity="0.8"/>
  <ellipse cx="610" cy="220" rx="120" ry="130" fill="#3A6E5A" opacity="0.85"/>
  <ellipse cx="730" cy="250" rx="80" ry="100" fill="#234D3D" opacity="0.9"/>
  <!-- Sunlight streaming through garden -->
  <polygon points="380,0 520,0 680,360 480,360" fill="#FFFBEB" opacity="0.25"/>

  <!-- Window Frame Mullions (Sleek Minimal Dark Bronze) -->
  <rect x="380" y="0" width="10" height="360" fill="#292019"/>
  <rect x="580" y="0" width="8" height="360" fill="#292019"/>
  <rect x="792" y="0" width="8" height="360" fill="#292019"/>
  <line x1="380" y1="120" x2="800" y2="120" stroke="#292019" stroke-width="4"/>
  <line x1="380" y1="358" x2="800" y2="358" stroke="#292019" stroke-width="6"/>

  <!-- Luxury Sheer Drapes (Pristine Ivory Linen) -->
  <path d="M740,0 Q720,180 750,360 L800,360 L800,0 Z" fill="#FAF9F6" opacity="0.6"/>
  <path d="M380,0 Q410,180 390,360 L380,360 Z" fill="#FAF9F6" opacity="0.4"/>

  <!-- Hardwood Oak Flooring -->
  <polygon points="0,340 800,340 800,500 0,500" fill="url(#suite-floor)"/>
  <!-- Floor planks -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#685544" stroke-width="1"/>
  <line x1="0" y1="425" x2="800" y2="425" stroke="#685544" stroke-width="1"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#685544" stroke-width="1"/>

  <!-- Left Wall Architectural Feature: Warm Oak Headwall with Integrated Clinical Ports -->
  <rect x="0" y="40" width="360" height="300" fill="#E6DDCF"/>
  <rect x="20" y="60" width="320" height="260" fill="#D8CEBD" stroke="#C5A36A" stroke-width="1.5"/>
  <!-- Concealed Medical Gas / Power Panel behind slide-wood panel -->
  <line x1="40" y1="80" x2="320" y2="80" stroke="#C5A36A" stroke-width="2"/>
  <circle cx="60" cy="95" r="4" fill="#C5A36A"/>
  <circle cx="80" cy="95" r="4" fill="#102C24"/>
  <circle cx="100" cy="95" r="4" fill="#3A6E5A"/>

  <!-- Warm Reading Sconce Lamp on Headwall -->
  <line x1="70" y1="120" x2="90" y2="120" stroke="#C5A36A" stroke-width="3"/>
  <circle cx="90" cy="120" r="10" fill="#FAF9F6" stroke="#C5A36A" stroke-width="2"/>
  <ellipse cx="90" cy="120" rx="30" ry="20" fill="#FFE8C2" opacity="0.4" filter="blur(6px)"/>

  <!-- Luxury Smart Hospital Bed (Adjustable, Ergonomic, Hotel-Quality Linens) -->
  <g transform="translate(190, 240)">
    <!-- Shadow -->
    <ellipse cx="0" cy="150" rx="140" ry="20" fill="#102C24" opacity="0.25" filter="blur(8px)"/>
    
    <!-- Bed frame (Natural American Walnut) -->
    <rect x="-120" y="40" width="240" height="80" rx="10" fill="#5E4A3B"/>
    <rect x="-115" y="-60" width="230" height="110" rx="8" fill="#4A3A2E"/>

    <!-- High-thread-count Egyptian Cotton Mattress & Duvet -->
    <path d="M-110,10 L110,10 L125,100 L-125,100 Z" fill="url(#bed-linens)"/>
    <!-- Folded Silk Runner (Forest Green with Gold Embroidery) -->
    <polygon points="-122,80 122,80 125,100 -125,100" fill="#102C24"/>
    <line x1="-122" y1="82" x2="122" y2="82" stroke="#C5A36A" stroke-width="2"/>

    <!-- Dual Ergonomic Feather Pillows -->
    <rect x="-95" y="-30" width="85" height="38" rx="8" fill="#FFFFFF" stroke="#E6DFD3" stroke-width="1.5" transform="rotate(-6 -50 -10)"/>
    <rect x="10" y="-30" width="85" height="38" rx="8" fill="#FFFFFF" stroke="#E6DFD3" stroke-width="1.5" transform="rotate(6 50 -10)"/>

    <!-- Integrated Bedside Smart Tablet on Articulating Arm -->
    <line x1="120" y1="40" x2="145" y2="0" stroke="#C5A36A" stroke-width="3"/>
    <rect x="135" y="-20" width="40" height="28" rx="4" fill="#102C24" stroke="#C5A36A" stroke-width="1.5"/>
    <rect x="138" y="-17" width="34" height="22" rx="2" fill="#5EEAD4" opacity="0.7"/>
  </g>

  <!-- Visitor Lounge Club Chair & Side Table by Window -->
  <g transform="translate(560, 360)">
    <!-- Low Brass Pedestal Side Table -->
    <ellipse cx="-70" cy="30" rx="35" ry="12" fill="#FAF9F6" stroke="#C5A36A" stroke-width="2"/>
    <line x1="-70" y1="30" x2="-70" y2="70" stroke="#C5A36A" stroke-width="6"/>
    <!-- Glass with lemon water -->
    <rect x="-76" y="10" width="12" height="18" rx="2" fill="#FAF9F6" stroke="#C5A36A" stroke-width="1" opacity="0.8"/>

    <!-- Velvet Armchair in Deep Forest Green -->
    <path d="M-20,0 C-20,-45 70,-45 70,0 L60,60 L-10,60 Z" fill="#15362C"/>
    <ellipse cx="25" cy="15" rx="42" ry="20" fill="#1C4538"/>
    <!-- Cushion -->
    <ellipse cx="25" cy="5" rx="36" ry="15" fill="#245445"/>
    <rect x="15" y="-15" width="24" height="20" rx="4" fill="#C5A36A"/>
  </g>

  <!-- Badge in top left corner -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="210" height="34" rx="17" fill="#FAF9F6" stroke="#C5A36A" stroke-width="1"/>
    <circle cx="18" cy="17" r="6" fill="#102C24"/>
    <text x="34" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#102C24">SUITE 402 • PRESIDENTIAL CARE</text>
  </g>
</svg>

