<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ortho-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="50%" stop-color="#F2EFE8"/>
      <stop offset="100%" stop-color="#E8E2D6"/>
    </linearGradient>
    <linearGradient id="bone-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="40%" stop-color="#EBE3D3"/>
      <stop offset="80%" stop-color="#D9CCA8"/>
      <stop offset="100%" stop-color="#B8A782"/>
    </linearGradient>
    <linearGradient id="cartilage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A36A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#102C24" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow-o" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#102C24" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#ortho-bg)"/>

  <!-- Geometric Grid & Axis -->
  <line x1="300" y1="40" x2="300" y2="410" stroke="#C5A36A" stroke-opacity="0.15" stroke-dasharray="4 4"/>
  <circle cx="300" cy="225" r="160" stroke="#C5A36A" stroke-opacity="0.12" stroke-dasharray="6 6" fill="none"/>
  
  <!-- Anatomical Knee Joint Structure -->
  <g filter="url(#shadow-o)" transform="translate(300, 220) scale(0.95)">
    <!-- Femur (Upper Bone) -->
    <path d="M-30,-170 L30,-170 L35,-70 C40,-35 75,-25 75,5 C75,25 50,30 25,25 C10,22 -5,5 -10,5 C-15,5 -30,22 -45,25 C-70,30 -90,25 -90,5 C-90,-25 -55,-35 -50,-70 Z" fill="url(#bone-grad)"/>

    <!-- Femoral Articular Cartilage (Smooth Blue/Gold Condyles) -->
    <path d="M-85,5 C-85,25 -50,32 -30,22 C-15,15 0,15 15,22 C35,32 70,25 70,5" stroke="url(#cartilage)" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Meniscus (Shock Absorption Cushion) -->
    <ellipse cx="-52" cy="38" rx="28" ry="7" fill="#C5A36A" opacity="0.85"/>
    <ellipse cx="42" cy="38" rx="28" ry="7" fill="#C5A36A" opacity="0.85"/>

    <!-- Tibia (Lower Shin Bone) & Fibula -->
    <!-- Fibula (Side Bone) -->
    <path d="M-75,45 C-70,50 -60,60 -65,170 L-85,170 C-85,90 -95,65 -90,45 Z" fill="#D9CCA8"/>
    <!-- Tibial Plateau & Shaft -->
    <path d="M-60,40 C-30,42 -5,35 0,38 C5,35 30,42 60,40 C75,40 75,60 55,75 C40,85 30,120 28,170 L-28,170 C-30,120 -40,85 -55,75 C-75,60 -75,40 -60,40 Z" fill="url(#bone-grad)"/>

    <!-- Cruciate Ligaments (ACL & PCL - Interlacing Gold & Green Strands) -->
    <path d="M-15,15 Q-5,28 15,40" stroke="#102C24" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M12,15 Q0,26 -12,40" stroke="#C5A36A" stroke-width="4.5" fill="none" stroke-linecap="round"/>

    <!-- Patella (Kneecap - Translucent overlay profile) -->
    <path d="M-22,-15 C-22,-40 22,-40 22,-15 C22,10 0,22 -5,22 C-10,22 -22,10 -22,-15 Z" fill="#FAF9F6" fill-opacity="0.8" stroke="#C5A36A" stroke-width="2"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#102C24" opacity="0.7">PATELLA</text>

    <!-- Articulation range indicator arc -->
    <path d="M95,-40 A110,110 0 0,1 95,90" stroke="#C5A36A" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <circle cx="95" cy="-40" r="3" fill="#C5A36A"/>
    <circle cx="95" cy="90" r="3" fill="#C5A36A"/>
  </g>

  <text x="50" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#102C24" opacity="0.6">ORTHOPEDICS &amp; JOINTS</text>
  <text x="540" y="55" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#C5A36A">DEPT. 04</text>
</svg>

